<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timbratura</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

main{
  max-width:620px;
  margin:30px auto;
  padding:20px;
}

h1{
  text-align:center;
  font-size:42px;
  margin-bottom:30px;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}

input,select{
  width:100%;
  padding:16px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:18px;
}

button{
  width:100%;
  padding:16px;
  margin:7px 0;
  border:0;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
}

.blue{background:#1683f5;color:white}
.green{background:#25c85a;color:white}
.red{background:#ff3b30;color:white}
.gray{background:#ddd;color:#111}

.hidden{display:none}

#hours{
  text-align:center;
  font-size:58px;
  font-weight:bold;
  margin:20px 0 5px;
  font-family:monospace;
}

#st{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin-bottom:20px;
}

.tabs{
  display:flex;
  gap:10px;
}

.tabs button{
  margin:0;
}

.error{
  color:red;
  margin-top:10px;
}

.detail{
  margin-top:15px;
}
</style>
</head>

<body>

<main>

<h1>⏱️ TIMBRATURA</h1>

<!-- LOGIN -->
<section id="login">

<div class="tabs">
<button id="bt" class="blue" onclick="setMode('employee')">
Dipendente
</button>

<button id="ba" class="gray" onclick="setMode('admin')">
Admin
</button>
</div>

<div class="card">

<input id="u" placeholder="Nome / Username">

<input id="p" type="password" placeholder="PIN">

<button class="blue" onclick="login()">
ACCEDI
</button>

<div id="err" class="error"></div>

</div>
</section>


<!-- DIPENDENTE -->
<section id="emp" class="hidden">

<div class="card">

<h2 id="name"></h2>

<div id="hours">00:00</div>

<div id="st">NON INIZIATA</div>

<button class="green" onclick="punch('start')">
INIZIO
</button>

<button class="blue" onclick="punch('pause')">
PAUSA / RIPRENDI
</button>

<button class="red" onclick="punch('finish')">
FINE
</button>

</div>


<div class="card">

<h2>Le mie ore</h2>

<input
id="edate"
type="date"
onchange="empDay()"
>

<div id="edetail" class="detail">
</div>

</div>

<button class="gray" onclick="logout()">
ESCI
</button>

</section>


<!-- ADMIN -->
<section id="adm" class="hidden">

<div class="card">

<h2>👑 Admin</h2>

<input
id="adate"
type="date"
onchange="adminLoad()"
>

<div id="summary"></div>

</div>


<div class="card">

<h2>Dettaglio dipendente</h2>

<select id="sel" onchange="adminDetail()">
<option value="">Seleziona dipendente</option>
</select>

<div id="detail"></div>

</div>

<button class="gray" onclick="logout()">
ESCI
</button>

</section>

</main>


<script>

const API="https://timbrature-7pee.onrender.com";

let mode="employee";
let session=null;
let records=[];
let employees=[];
let liveTimer=null;


/* ELEMENTI */

const $ = id => document.getElementById(id);


/* DATA */

function today(){

  const d=new Date();

  return d.getFullYear()
    +"-"
    +String(d.getMonth()+1).padStart(2,"0")
    +"-"
    +String(d.getDate()).padStart(2,"0");

}

$("edate").value=today();
$("adate").value=today();


/* API */

async function api(path,options={}){

  const headers={
    "Content-Type":"application/json"
  };

  if(session && session.token){
    headers.Authorization="Bearer "+session.token;
  }

  const response=await fetch(API+path,{
    ...options,
    headers:{
      ...headers,
      ...(options.headers||{})
    }
  });

  if(!response.ok){

    let message="Errore server";

    try{
      const data=await response.json();
      message=data.error || data.message || message;
    }catch(e){}

    throw new Error(message);
  }

  return response.json();

}


/* MODALITA' */

function setMode(newMode){

  mode=newMode;

  $("bt").className =
    mode==="employee" ? "blue" : "gray";

  $("ba").className =
    mode==="admin" ? "blue" : "gray";

}


/* LOGIN */

async function login(){

  $("err").textContent="";

  try{

    const result=await api("/login",{
      method:"POST",
      body:JSON.stringify({
        username:$("u").value.trim(),
        pin:$("p").value
      })
    });

    session=result;

    $("login").classList.add("hidden");

    if(session.role==="admin"){

      $("adm").classList.remove("hidden");

      await adminLoad();

    }else{

      $("emp").classList.remove("hidden");

      $("name").textContent =
        session.name ||
        session.username ||
        "Dipendente";

      await empLoad();

      startLiveCounter();

    }

  }catch(e){

    console.error(e);

    $("err").textContent=e.message;

  }

}


/* SECONDI */

function secondsForRecord(r){

  if(!r || !r.start_at){
    return 0;
  }

  const start=new Date(r.start_at);

  let end;

  if(r.finish_at){
    end=new Date(r.finish_at);
  }else{
    end=new Date();
  }

  let seconds=Math.floor(
    (end-start)/1000
  );

  seconds-=Number(r.pause_seconds||0);

  return Math.max(0,seconds);

}


/* FORMATO TEMPO */

function fmt(seconds){

  seconds=Math.max(
    0,
    Math.floor(seconds||0)
  );

  const h=Math.floor(seconds/3600);

  const m=Math.floor(
    (seconds%3600)/60
  );

  const s=seconds%60;

  return String(h).padStart(2,"0")
    +":"
    +String(m).padStart(2,"0")
    +":"
    +String(s).padStart(2,"0");

}


/* TIMBRATURA */

async function punch(action){

  try{

    console.log("PUNCH:",action);

    const result=await api("/punch",{
      method:"POST",
      body:JSON.stringify({action})
    });

    console.log("PUNCH OK:",result);

    if(action==="start"){

      $("hours").textContent="00:00";
      $("hours").style.color="green";

      $("st").textContent="IN CORSO";

      /*
       * Il contatore parte dall'istante
       * del click, così non eredita un
       * vecchio start_at.
       */

      startLiveCounter(new Date());

    }

    if(action==="pause"){

  if(liveTimer){
    clearInterval(liveTimer);
    liveTimer=null;
  }

  $("st").textContent="PAUSA";

  await empLoad();
}

    if(action==="finish"){

      $("st").textContent="FINITA";

      if(liveTimer){
        clearInterval(liveTimer);
        liveTimer=null;
      }

      await empLoad();

    }

  }catch(e){

    console.error("PUNCH ERROR:",e);

    alert("Errore timbratura: "+e.message);

  }

}


/* CARICA RECORD */

async function empLoad(){

  try{

    records=await api("/records");

    empDay();

  }catch(e){

    console.error("empLoad:",e);

  }

}


/* ORE DEL GIORNO */

function empDay(){
  const date=$("edate").value;

  const r=records.find(
    x=>String(x.work_day).slice(0,10)===date
  );

  if(!r){
    $("edetail").innerHTML=
      "<p>Nessuna timbratura.</p>";
    return;
  }

  $("edetail").innerHTML=
    "<p><b>Inizio:</b> "+
    (r.start_at||"-")+
    "</p>"+
    "<p><b>Fine:</b> "+
    (r.finish_at||"-")+
    "</p>"+
    "<p><b>Totale:</b> "+
    fmt(secondsForRecord(r))+
    "</p>";
}


/* CONTATORE LIVE */

function startLiveCounter(startAt){

  if(liveTimer){
    clearInterval(liveTimer);
  }

  const start=new Date(startAt);

  function update(){
    const seconds=Math.floor(
      (Date.now()-start.getTime())/1000
    );

    $("hours").textContent=fmt(seconds);
  }

  update();

  liveTimer=setInterval(update,1000);
}
  

/* ADMIN */

async function adminLoad(){

  try{

    employees=await api("/employees");

    const list=employees.filter(
      e=>e.role==="employee"
    );

    $("sel").innerHTML=
      '<option value="">Seleziona dipendente</option>'
      +
      list.map(e=>
        `<option value="${e.id}">
          ${e.name||e.username||e.id}
        </option>`
      ).join("");

    const date=$("adate").value;

    const all=await api(
      "/records"
    );

    const day=all.filter(
     r=>String(r.work_day).slice(0,10)===date
    );

    $("summary").innerHTML=
      "<p>Timbrature del "+
      date+
      ": <b>"+
      day.length+
      "</b></p>";

  }catch(e){

    console.error("ADMIN:",e);

  }

}


/* DETTAGLIO ADMIN */

async function adminDetail(){

  const id=$("sel").value;

  if(!id){

    $("detail").innerHTML="";

    return;
  }

  try{

    const date=$("adate").value;

    const rs=await api(
      "/records?employee_id="+id
    );

    const r=rs.find(
    x=>String(x.work_day).slice(0,10)===date
    );

    if(!r){

      $("detail").innerHTML=
        "<p>Nessuna timbratura.</p>";

      return;
    }

    $("detail").innerHTML=
      "<p><b>Inizio:</b> "+
      (r.start_at||"-")+
      "</p>"+
      "<p><b>Fine:</b> "+
      (r.finish_at||"-")+
      "</p>"+
      "<p><b>Totale:</b> "+
      fmt(secondsForRecord(r))+
      "</p>";

  }catch(e){

    console.error("DETAIL:",e);

  }

}


/* LOGOUT */

function logout(){

  if(liveTimer){
    clearInterval(liveTimer);
    liveTimer=null;
  }

  session=null;

  location.reload();

}

</script>

</body>
</html>
